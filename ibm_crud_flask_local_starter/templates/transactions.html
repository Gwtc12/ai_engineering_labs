<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction Records</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border-bottom: 1px solid #ddd; padding: 10px; text-align: left; }
    a { margin-right: 10px; }
  </style>
</head>
<body>
  <h1>Transaction Records</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Date</th>
        <th>Amount</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for transaction in transactions %}
      <tr>
        <td>{{ transaction.id }}</td>
        <td>{{ transaction.date }}</td>
        <td>{{ transaction.amount }}</td>
        <td>
          <a href="{{ url_for('edit_transaction', transaction_id=transaction.id) }}">Edit</a>
          <a href="{{ url_for('delete_transaction', transaction_id=transaction.id) }}">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="{{ url_for('add_transaction') }}">Add Transaction</a>
</body>
</html>
